<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="LinguaPal architecture: browser to FastAPI, with a swappable open-weight model">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#page)"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">How LinguaPal works</text>
  <text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">One FastAPI app, a plain-JS page, and an open-weight model behind a single env-var seam.</text>

  <!-- Browser -->
  <rect x="40" y="140" rx="16" width="250" height="150" fill="#0ea5e9" opacity="0.12" stroke="#38bdf8"/>
  <text x="165" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#7dd3fc">Browser</text>
  <text x="165" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">static/index.html</text>
  <text x="165" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">app.js · style.css</text>
  <text x="165" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">chat UI + companion orb</text>

  <!-- FastAPI -->
  <rect x="360" y="110" rx="16" width="330" height="260" fill="#6366f1" opacity="0.12" stroke="#818cf8"/>
  <text x="525" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#a5b4fc">FastAPI app (app/)</text>

  <rect x="388" y="172" rx="10" width="274" height="42" fill="#111c2e" stroke="#334155"/>
  <text x="525" y="199" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0">main.py — HTTP API, static serving</text>

  <rect x="388" y="224" rx="10" width="274" height="42" fill="#111c2e" stroke="#334155"/>
  <text x="525" y="251" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0">prompts.py — REPLY / CORRECTIONS / VOCAB</text>

  <rect x="388" y="276" rx="10" width="274" height="42" fill="#111c2e" stroke="#334155"/>
  <text x="525" y="303" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0">srs.py — spaced-repetition scheduler</text>

  <rect x="388" y="328" rx="10" width="274" height="30" fill="#111c2e" stroke="#334155"/>
  <text x="525" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">store.py — SQLite (learner, cards, history)</text>

  <!-- LLM -->
  <rect x="770" y="140" rx="16" width="390" height="150" fill="#22c55e" opacity="0.12" stroke="#22c55e"/>
  <text x="965" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#86efac">Open-weight model (app/llm.py)</text>
  <text x="965" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">OpenAI-compatible · swappable via LLM_BASE_URL</text>
  <rect x="800" y="228" rx="10" width="330" height="40" fill="#0b1220" stroke="#334155"/>
  <text x="965" y="253" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">Google AI Studio · gemma-4-26b-a4b-it</text>

  <!-- local option -->
  <rect x="770" y="320" rx="16" width="390" height="70" fill="#f59e0b" opacity="0.12" stroke="#f59e0b"/>
  <text x="965" y="351" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#fcd34d">…or fully offline: LM Studio / Ollama</text>
  <text x="965" y="375" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">same code — only LLM_BASE_URL changes</text>

  <!-- arrows -->
  <line x1="290" y1="215" x2="358" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="324" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">HTTP</text>

  <line x1="690" y1="215" x2="768" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="729" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">chat</text>

  <line x1="690" y1="345" x2="768" y2="352" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="729" y="392" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">offline</text>

  <text x="40" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Renderer: FastAPI + front end (always-on). Model: open weights, hosted or local — the private part stays yours.</text>
  <text x="40" y="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">No signup · no analytics · MIT licensed</text>
</svg>
