# Render Blueprint — hosts LinguaPal's app/front end.
# Uses the FREE plan (no credit required). The open-weight model runs on an
# OpenAI-compatible provider (Render has no GPU); Render serves the app.
# Free notes: the service sleeps after ~15 min idle (first hit is slow), and
# there is no persistent disk, so SQLite progress resets on redeploy/restart.
services:
  - type: web
    name: linguapal
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Writable path inside the container (free tier has no mounted disk).
      - key: DATA_DIR
        value: /tmp/linguapal
      # Google AI Studio (Gemini API) OpenAI-compatible endpoint serves Gemma
      # open weights on the free tier -- no credit card needed. Get a key at
      # https://aistudio.google.com/apikey and set LLM_API_KEY in the Render
      # dashboard. Swap LLM_MODEL for another Gemma id if you prefer.
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemma-4-26b-a4b-it
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TEMPERATURE
        value: "0.6"
      # Gemma 4 is a thinking model: it emits a <thought> block before answering,
      # so it needs headroom to finish thinking and still produce REPLY/VOCAB.
      - key: LLM_MAX_TOKENS
        value: "700"
