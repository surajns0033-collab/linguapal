# Render Blueprint — hosts LinguaPal's app/front end.
# Uses the FREE plan (no credit required). The open-weight model runs on an
# OpenAI-compatible provider (Render has no GPU); Render serves the app.
# Free notes: the service sleeps after ~15 min idle (first hit is slow), and
# there is no persistent disk, so SQLite progress resets on redeploy/restart.
services:
  - type: web
    name: linguapal
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Writable path inside the container (free tier has no mounted disk).
      - key: DATA_DIR
        value: /tmp/linguapal
      # Defaults point at Groq, which serves Gemma open weights for free.
      # Set LLM_API_KEY in the Render dashboard (it is a secret, not stored here).
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: gemma2-9b-it
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TEMPERATURE
        value: "0.6"
